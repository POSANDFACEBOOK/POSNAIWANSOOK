<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ในวันสุข · FoodCost</title>

    <!-- ไอคอนทั้งชุดสร้างจาก src/assets/logo.png ด้วย `node scripts/make-icons.mjs`
         เปลี่ยนโลโก้เมื่อไหร่ให้ทับไฟล์นั้นแล้วรันสคริปต์ใหม่ อย่าแก้ไฟล์ใน public/ ด้วยมือ -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- iOS ไม่อ่าน manifest จึงต้องบอกไอคอนหน้าจอโฮมตรงนี้แยกต่างหาก -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ในวันสุข" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F2EBE3" />
    <script>
      // ── Lock zoom ───────────────────────────────────────────────────────────
      // The viewport meta (user-scalable=no) blocks pinch on Android/PWA, but iOS
      // Safari ignores it — so we also cancel the pinch gesture + multi-touch +
      // ctrl/⌘-wheel + ctrl/⌘ +/- zoom. Single-finger scrolling is untouched.
      (function () {
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
          document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener("touchmove", function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault(); // pinch = 2+ fingers
        }, { passive: false });
        window.addEventListener("wheel", function (e) {
          if (e.ctrlKey) e.preventDefault(); // trackpad pinch / ctrl-wheel zoom
        }, { passive: false });
        window.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "0")) e.preventDefault();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
