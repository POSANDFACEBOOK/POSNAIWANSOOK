<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ในวันสุข · FoodCost</title>

    <!-- ไอคอนทั้งชุดสร้างจาก src/assets/logo.png ด้วย `node scripts/make-icons.mjs`
         เปลี่ยนโลโก้เมื่อไหร่ให้ทับไฟล์นั้นแล้วรันสคริปต์ใหม่ อย่าแก้ไฟล์ใน public/ ด้วยมือ -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- iOS ไม่อ่าน manifest จึงต้องบอกไอคอนหน้าจอโฮมตรงนี้แยกต่างหาก -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ในวันสุข" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- ── ลิงก์ manifest ต้องถูกตัวตั้งแต่ตอนแปลง HTML ─────────────────────
         iOS ตอนกด "เพิ่มไปยังหน้าจอโฮม" ไม่ได้จำ URL ที่เปิดอยู่ แต่ไปอ่าน
         start_url จาก manifest — และ Safari อ่านครั้งเดียวตอนโหลดหน้าเท่านั้น
         เคยลองสลับ href ทีหลังด้วย React แล้ว "ไม่ทัน" ทางลัดยังพาไปหลังบ้าน
         สคริปต์นี้จึงต้องรันตรงนี้ ระหว่างเบราว์เซอร์กำลังแปลง <head> อยู่
         ไฟล์ pos-*.webmanifest สร้างจาก scripts/make-pos-manifests.mjs ตอน build -->
    <script>
      (function () {
        var href = "/manifest.webmanifest";
        try {
          var p = new URLSearchParams(location.search);
          var b = p.get("branch");
          if (p.get("pos") === "1" && b && /^[0-9]+$/.test(b)) {
            href = "/pos-" + b + ".webmanifest";
            var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (m) m.setAttribute("content", "ขายหน้าร้าน");
          }
        } catch (e) { /* อ่าน URL ไม่ได้ = ใช้ตัวหลัก ดีกว่าไม่มี manifest เลย */ }
        var l = document.createElement("link");
        l.rel = "manifest"; l.href = href;
        document.head.appendChild(l);
      })();
    </script>
    <meta name="theme-color" content="#F2EBE3" />
    <script>
      // ── หน้าลูกค้าสแกน QR (?scan=1): ทำให้ "หน้าเว็บธรรมดาที่สุด" ทุกเบราว์เซอร์/ทุกแอปที่ใช้สแกนเลื่อนได้เหมือนกัน ──
      // (20 ต.ค. 69 ลูกค้า Android สแกนแล้วเลื่อนเมนูไม่ได้ / สั่งไม่ได้ — เคยเกิดกับเบราว์เซอร์ในแอป LINE เมื่อ ก.ย. ด้วย)
      // · LINE บน Android: ส่งต่อไปเปิดในเบราว์เซอร์จริงด้วย openExternalBrowser=1 (คุณสมบัติของ LINE เอง)
      //   มีพารามิเตอร์แล้วไม่ส่งซ้ำ (กันวน) · LINE ไม่รับก็แค่โหลดหน้าเดิมต่อตามปกติ
      // · ปิดการล็อกซูม/ล็อกสองนิ้วของหน้าพนักงาน และติดป้าย cust-scan ให้ CSS ด้านล่างคืนค่าปกติของเบราว์เซอร์
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          if (p.get("scan") !== "1") return;
          var ua = navigator.userAgent || "";
          if (/\bLine\//i.test(ua) && /Android/i.test(ua) && !p.has("openExternalBrowser")) {
            p.set("openExternalBrowser", "1");
            location.replace(location.pathname + "?" + p.toString() + location.hash);
            return;
          }
          document.documentElement.className += " cust-scan";
          var v = document.querySelector('meta[name="viewport"]');
          if (v) v.setAttribute("content", "width=device-width, initial-scale=1.0, viewport-fit=cover");
        } catch (e) { /* อ่าน URL ไม่ได้ = ใช้ค่าเดิม */ }
      })();
    </script>
    <script>
      // ── Lock zoom ───────────────────────────────────────────────────────────
      // The viewport meta (user-scalable=no) blocks pinch on Android/PWA, but iOS
      // Safari ignores it — so we also cancel the pinch gesture + multi-touch +
      // ctrl/⌘-wheel + ctrl/⌘ +/- zoom. Single-finger scrolling is untouched.
      (function () {
        // หน้าลูกค้าสแกน: ไม่ผูกตัวดักนิ้วใดๆ เลย ปล่อยให้เบราว์เซอร์เลื่อน/ซูมเอง (ลูกค้าซูมดูรูปเมนูได้)
        if (/\bcust-scan\b/.test(document.documentElement.className)) return;
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
          document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
        // ผูกตัวบล็อกเฉพาะตอนมีนิ้วที่สองแตะลงมา แล้วถอดออกเมื่อเหลือนิ้วเดียว
        // นิ้วเดียว (เลื่อนจอ/แตะเมนู = แทบทั้งหมดของการใช้งาน) จึงไม่ต้องผ่าน JS เลย
        // ถ้าผูกค้างไว้ตลอด ทุกการขยับนิ้วต้องรอ JS ตอบก่อนเบราว์เซอร์ถึงจะเลื่อนจอให้
        var blockPinch = function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault(); // pinch = 2+ fingers
        };
        document.addEventListener("touchstart", function (e) {
          if (e.touches && e.touches.length > 1) document.addEventListener("touchmove", blockPinch, { passive: false });
        }, { passive: true });
        // ถอดตัวบล็อกออกทั้ง touchend และ touchcancel
        // iOS ยิง touchcancel (ไม่ใช่ touchend) ทุกครั้งที่ระบบยึดนิ้วไป — แถบแจ้งเตือน
        // ปัดเปิดศูนย์ควบคุม สายเข้า สลับแอป ฯลฯ ถ้าดักแต่ touchend ตัวบล็อกจะค้างผูกกับ
        // document ถาวร แล้วทุกการขยับนิ้วหลังจากนั้นต้องวิ่งผ่าน JS ทั้งหมด
        // ที่แย่กว่านั้นคือมันกิน touchmove ของทุกลำดับที่มีนิ้วแตะเกินหนึ่ง ⟹ วางนิ้วโป้ง
        // ประคองไอแพดไว้แล้วแตะสั่งอาหารด้วยอีกนิ้ว การแตะนั้นจะไม่กลายเป็นคลิกเลย
        // (อาการ "บางจังหวะกดอะไรไม่ได้" ขึ้นกับว่าถือเครื่องยังไง จึงเป็นๆ หายๆ)
        var unblock = function (e) {
          if (!e.touches || e.touches.length < 2) document.removeEventListener("touchmove", blockPinch);
        };
        document.addEventListener("touchend", unblock, { passive: true });
        document.addEventListener("touchcancel", unblock, { passive: true });
        // กันเหนียวอีกชั้น: หน้าจอถูกพักแล้วกลับมา ให้ถอดตัวบล็อกทิ้งเสมอ
        // เพราะลำดับนิ้วที่ค้างอยู่ตอนสลับแอปอาจไม่มีอีเวนต์ปิดท้ายมาให้เลย
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") document.removeEventListener("touchmove", blockPinch);
        });
        window.addEventListener("wheel", function (e) {
          if (e.ctrlKey) e.preventDefault(); // trackpad pinch / ctrl-wheel zoom
        }, { passive: false });
        window.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "0")) e.preventDefault();
        });
      })();
    </script>
    <style>
      /* หน้าลูกค้าสแกน: กรอบต้องสูง "เท่าที่ตาเห็น" พอดี แล้วให้ตัวรายการเมนูเป็นตัวเลื่อนตัวเดียว
         เดิมกรอบใช้ min-height:100vh = สูงตามเนื้อหา (11,000px เมื่อมี 250 เมนู) กล่องเมนูข้างในเลย
         ไม่เคยล้น ไม่เคยเลื่อน และบนมือถือนิ้วไปแตะโดนกล่องนั้นเต็มจอ = เลื่อนดูเมนูไม่ได้เลย
         100dvh คือความสูงที่มองเห็นจริงตอนแถบที่อยู่ของ Safari ยุบ/กางอยู่
         เขียน 100vh ไว้ก่อนเผื่อเบราว์เซอร์เก่าที่ยังไม่รู้จัก dvh (บรรทัดที่ไม่รู้จักจะถูกทิ้งไปเอง) */
      .cust-shell { min-height: 100vh; min-height: 100dvh; }
      /* หน้าลูกค้าสแกน: คืนค่าปกติของเบราว์เซอร์ทุกอย่างที่หน้าพนักงานปรับไว้ (globalStyle ในแอป)
         html{overflow-x:hidden} · body{touch-action:manipulation} · div{overscroll-behavior:contain}
         ค่าพวกนี้ปลอดภัยบน Chrome/Safari แต่เบราว์เซอร์ในแอป (LINE/Facebook/Samsung) บางรุ่นเลื่อนหน้าไม่ได้
         กันหน้าล้นแนวนอนด้วย overflow-x:clip ที่กรอบแทน (clip ไม่ทำให้กรอบกลายเป็นกล่องเลื่อนซ้อน) */
      html.cust-scan { overflow-x: visible !important; max-width: none !important; }
      html.cust-scan body { touch-action: auto !important; }
      html.cust-scan div { overscroll-behavior: auto; }
      html.cust-scan .cust-shell { overflow-x: clip; }
      /* กดค้างที่ปุ่มบนไอแพด = iOS เลือกข้อความบนปุ่มแล้วขึ้นแถบ "คัดลอก · ค้นดู · แปลภาษา"
         บังปุ่มข้างใต้ และพนักงานต้องแตะที่อื่นก่อนถึงจะกดต่อได้ ปุ่มไม่มีอะไรให้คัดลอกอยู่แล้ว
         ช่องกรอกข้อความ (input/textarea) ไม่โดนกฎนี้ ยังเลือก/วางข้อความได้ตามปกติ */
      button, [role="button"] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
